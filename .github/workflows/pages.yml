name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Create Pages directory
        run: |
          mkdir -p _site
          cp install.sh _site/
          cp uninstall.sh _site/
          cp Caddyfile _site/
          cp README.md _site/
          
          # Create index.html redirect to README
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Zin - Minimal PMTiles Tile Server</title>
            <meta http-equiv="refresh" content="7; url=https://github.com/unvt/zin">
            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
                max-width: 800px;
                margin: 50px auto;
                padding: 20px;
                line-height: 1.6;
              }
              code {
                background: #f4f4f4;
                padding: 2px 6px;
                border-radius: 3px;
              }
              pre {
                background: #f4f4f4;
                padding: 15px;
                border-radius: 5px;
                overflow-x: auto;
              }
            </style>
          </head>
          <body>
            <h1>Zin - Minimal PMTiles Tile Server</h1>
            <p>Minimal PMTiles tile server for Raspberry Pi Zero W</p>
            
            <h2>Quick Install</h2>
            <pre><code>curl -fsSL https://unvt.github.io/zin/install.sh | sudo -E bash -</code></pre>
            
            <h2>Files</h2>
            <ul>
              <li><a href="install.sh">install.sh</a> - Installation script</li>
              <li><a href="uninstall.sh">uninstall.sh</a> - Uninstallation script</li>
              <li><a href="Caddyfile">Caddyfile</a> - Caddy configuration</li>
            </ul>
            
            <p>Redirecting to <a href="https://github.com/unvt/zin">GitHub repository</a>...</p>
          </body>
          </html>
          EOF
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
